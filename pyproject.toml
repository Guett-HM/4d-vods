[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "4d-vods"
version = "1.1.0"
description = "Optical data storage in glass with a self-aligning code for low-cost readers: open simulation study"
readme = "README.md"
license = "MIT"
authors = [{ name = "Hakim Guettal" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://guetthm.github.io/4d-vods/"
Repository = "https://github.com/GuettHM/4d-vods"
DOI = "https://doi.org/10.5281/zenodo.24268721"

[project.scripts]
vods = "vods.cli:main"

# The CLI finds sim/ and results/ next to the package: install in editable mode
# (pip install -e .) or simply run "python -m vods" from the repository root.
[tool.setuptools]
packages = ["vods"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["sim", "vods"]
omit = ["sim/make_figures.py", "sim/make_illustrations.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E701", "E702", "E731", "E741", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["vods", "vods_sim", "samm_sim"]
